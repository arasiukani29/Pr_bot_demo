name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Automated Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Run PR Bot
        uses: RohitKeshavala/PR_Review_Bot/.github/workflows/reusable-pr-review.yml@main
        with:
          target-path: '.'
          fail-on-changes: false              # Set to true if you want CI to fail on CHANGES_REQUESTED
        secrets:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 