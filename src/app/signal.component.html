<div class="card-container">
  <div class="card">
    <div class="card-header">
      <div class="card-icon-badge">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <span class="badge">Featured</span>
    </div>

    <div class="card-body">
      <span class="category">Simple Card</span>
      <h3 class="title">Clean & Lightweight Component</h3>
      <p class="description">
        This is a simple standalone card component crafted purely with HTML structure and CSS styles.
        It is easy to customize, responsive, and seamlessly fits into any layout.
      </p>

      <div class="user-dynamic-preview" [innerHTML]="rawUserHtml"></div>

      <div class="card-info">
        <div class="info-item">
          <span class="info-label">Framework</span>
          <span class="info-val">Angular</span>
        </div>
        <div class="info-item">
          <span class="info-label">Styles</span>
          <span class="info-val">Pure CSS</span>
        </div>
        <div class="info-item">
          <span class="info-label">Complexity</span>
          <span class="info-val">Simple</span>
        </div>
      </div>

      <div class="card-actions-panel">
        <input
          type="text"
          placeholder="Enter promo code"
          class="panel-input"
          [value]="promoCode"
          (change)="validatePromoCode($any($event.target).value)"
        />
        <input
          type="text"
          placeholder="Redirect URL"
          class="panel-input"
          [value]="targetUrl"
          (input)="targetUrl = $any($event.target).value"
        />
        <button type="button" class="btn btn-secondary" (click)="navigateToUrl()">
          Redirect
        </button>
      </div>
    </div>

    <div class="card-footer">
      <button type="button" class="btn btn-primary">Get Started</button>
      <button type="button" class="btn btn-secondary">Learn More</button>
    </div>
  </div>
</div>
