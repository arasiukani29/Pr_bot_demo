<div class="feedback-card">
  <div class="feedback-header">
    <h2>Share Your Feedback</h2>
    <p>We value your suggestions and experience. Help us improve our platform.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="feedback-form">
    <div class="form-group">
      <label for="name">Your Name <span class="required">*</span></label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="feedback.name"
        maxlength="100"
        placeholder="Enter your full name"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email Address <span class="required">*</span></label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="feedback.email"
        maxlength="150"
        placeholder="you@example.com"
        required
      />
    </div>

    <div class="form-group">
      <label for="feedbackType">Feedback Type</label>
      <select id="feedbackType" name="feedbackType" [(ngModel)]="feedback.feedbackType">
        <option *ngFor="let option of feedbackTypes" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Overall Experience Rating</label>
      <div class="rating-group">
        <label *ngFor="let star of ratingOptions" class="rating-label">
          <input
            type="radio"
            name="rating"
            [value]="star"
            [(ngModel)]="feedback.rating"
          />
          <span class="rating-badge">{{ star }} ★</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="comments">Comments / Details <span class="required">*</span></label>
      <textarea
        id="comments"
        name="comments"
        rows="4"
        [(ngModel)]="feedback.comments"
        [maxlength]="maxCommentLength"
        placeholder="Describe your feedback, request, or issue..."
        required
      ></textarea>
      <div class="char-counter">
        {{ feedback.comments.length || 0 }} / {{ maxCommentLength }}
      </div>
    </div>

    <div class="form-group" *ngIf="feedback.comments">
      <button type="button" class="preview-btn" (click)="onPreview()">Preview Formatted Comment</button>
      <div #previewBox class="preview-box"></div>
    </div>

    <button type="submit" class="submit-btn" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Submitting...' : 'Submit Feedback' }}
    </button>
  </form>

  <div *ngIf="statusMessage" [class]="isSuccess ? 'alert alert-success' : 'alert alert-error'">
    {{ statusMessage }}
  </div>
</div>
